# The enhancement configuration every agent run of this port is gated under.
#
# WHY THIS FILE EXISTS. PSXPORT_SETTINGS overrides the product's own working-directory discovery, so
# leaving it unset does not select defaults -- it selects whichever untracked psxport_settings.ini
# happens to sit in the repository root. Measured 2026-09-19 in the Spyro tree: oracle comparisons
# recording no product environment had always run with widescreen and 60fps on, from the operator's
# personal file, while the same command on a fresh clone or in CI would have compared an unenhanced
# product and looked identical. psxport's agent_environment now refuses without a tracked file.
#
# These are the two enhancements under test and nothing else; every other knob stays at the product
# default so a gate exercises the shipping path rather than one operator's preferences. A run that
# wants the enhancements OFF names a tracked file that says so, never an absent one.
#
# AND WHY aspect IS 1 AND NOT 3. It said 3 -- ASPECT_AUTO -- until 2026-09-20, and AUTO resolves to
# the SINK's aspect. An agent run is headless, so it has no wide sink and AUTO resolves to 4:3.
# psxport's runtime/psx/picture_announce.h already records this title measuring `aspect=3
# wide_engine=1 native_width=320 render_width=320` headless against `render_width=428` at aspect=1,
# and says to read render_width rather than wide_engine for exactly this reason. So the 34/34
# checkpoints byte-identical "off versus on" were both collected with widescreen OFF. An agent gate
# cannot use AUTO; it must name the aspect it is testing.
aspect=1
fps60=1
