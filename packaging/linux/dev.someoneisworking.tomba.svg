<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Tomba! port icon</title>
  <desc id="description">A spiky pink tuft above a grinning round face on a leafy green backdrop.</desc>
  <defs>
    <linearGradient id="backdrop" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f7a2a"/>
      <stop offset="1" stop-color="#0c260b"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="106" fill="url(#backdrop)"/>
  <rect x="35" y="35" width="442" height="442" rx="91" fill="none" stroke="#ff8ccf" stroke-width="6" opacity=".75"/>

  <g filter="url(#shadow)" stroke-linejoin="round">
    <path d="M120 250l20-90 40 50 30-110 46 90 46-100 34 110 50-60 6 110Z" fill="#ff5fb4" stroke="#4a0b2c" stroke-width="12"/>
    <circle cx="256" cy="300" r="112" fill="#f7c48c" stroke="#4a2a0c" stroke-width="12"/>
    <circle cx="214" cy="284" r="14" fill="#2a1406"/>
    <circle cx="298" cy="284" r="14" fill="#2a1406"/>
    <path d="M198 336c36 40 80 40 116 0" fill="none" stroke="#4a2a0c" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
